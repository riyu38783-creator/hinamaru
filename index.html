<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#dff4ff"><title>ひなまる教室</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#dff4ff,#fff0f8);color:#36546c;font:18px system-ui,sans-serif;min-height:100vh}main{max-width:620px;margin:auto;padding:16px;text-align:center}section{background:white;border-radius:26px;padding:20px;margin:14px 0;box-shadow:0 5px 0 #cce5f2}button,input{font:inherit;padding:12px;border:0;border-radius:16px;margin:5px;background:#e1f4ff;color:#34536b}button{font-weight:bold;cursor:pointer;min-height:48px}button:active{transform:scale(.96)}.pink{background:#ffe1ed}.big{font-size:36px;font-weight:bold}.keys button{min-width:25%;font-size:24px}.dots{display:grid;grid-template-columns:repeat(5,28px);gap:5px;justify-content:center;margin:10px auto}.dot{height:28px;border-radius:50%;background:#ffd477;border:2px solid #e9b64d}.empty{background:#f0f5fa;border-color:#dbe5ee}svg{max-width:200px}small{font-size:13px}input{max-width:120px}progress{width:90%;accent-color:#83c8e9}summary{cursor:pointer}#feedback{min-height:52px} .branch{font-size:24px;color:#5585a5} </style><main><h2>☁️ ひなまる教室</h2><section><svg viewBox="0 0 200 125" aria-label="オリジナルのうさぎ"><g fill="white" stroke="#8bc9e7" stroke-width="3"><ellipse cx="76" cy="34" rx="16" ry="32" transform="rotate(-15 76 34)"/><ellipse cx="124" cy="34" rx="16" ry="32" transform="rotate(15 124 34)"/><ellipse cx="100" cy="79" rx="51" ry="40"/></g><g fill="#5599bd"><ellipse cx="81" cy="76" rx="4" ry="7"/><ellipse cx="119" cy="76" rx="4" ry="7"/><path d="M94 89 Q100 96 106 89" fill="none" stroke="#5599bd" stroke-width="3"/></g><g fill="#ffc9dc"><ellipse cx="69" cy="89" rx="9" ry="4"/><ellipse cx="131" cy="89" rx="9" ry="4"/></g><text id="accessory" x="145" y="42" font-size="30">⭐</text></svg><div id="feedback">いっしょに がんばろう！</div><h3>🐷 ちょきんばこ <span id="money">0</span> 円</h3><div id="stats"></div><progress id="mission" max="10" value="0"></progress><small> きょうの ミッション：10もん</small></section><button onclick="start('add')">たしざん</button><button onclick="start('sub')" class="pink">ひきざん</button><button onclick="start('jp')">こくご</button><button onclick="review()">ふくしゅう</button><section><div class="big" id="question"></div><div class="branch" id="branch"></div><div id="visual"></div><p id="prompt"></p><button onclick="hint()">💡 ヒント</button><button onclick="speak()">🔊 よむ</button><div class="keys" id="keys"></div><button id="next" hidden onclick="start(mode)">つぎの もんだい →</button></section><section>🎀 きせかえ <div id="dress"></div></section><section><button onclick="parent()">🔒 おうちのひとへ</button><div id="parentPanel" hidden><p>1問 <input id="rate" type="number" min="0" max="100"> 円</p><p>1日の上限 <input id="cap" type="number" min="0" max="10000"> 円</p><p>暗証番号 <input id="pin" type="password" maxlength="8"></p><button onclick="settings()">保存</button><button onclick="pay()">お小遣いを渡した</button><button onclick="backup()">記録をバックアップ</button><button onclick="document.getElementById('restore').click()">記録を復元</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreFile(this)"><button onclick="document.getElementById('parentPanel').hidden=true">閉じる</button><p><small>初期暗証番号は1234。端末内保存のためデータ消去で記録が消えます。暗証番号は簡易ロックです。実際の送金はしません。</small></p></div></section></main><script>
const $=id=>document.getElementById(id), defaults={money:0,rate:1,cap:30,count:0,day:'',today:0,daily:0,pin:'1234',mistakes:[],dress:'⭐'};let s={...defaults};try{Object.assign(s,JSON.parse(localStorage.getItem('hinamaru-v1')||'{}'))}catch(e){}let mode='add',a,b,x,y,step,done,j,wrong=false;const jp=[['山','やま','かわ','そら'],['川','かわ','やま','うみ'],['花','はな','くさ','き'],['犬','いぬ','ねこ','とり'],['月','つき','ほし','ひ'],['空','そら','あめ','ゆき'],['雨','あめ','かぜ','そら'],['学校','がっこう','せんせい','ともだち'],['先生','せんせい','がっこう','こども'],['水','みず','ひ','つち'],['木','き','はな','くさ'],['手','て','あし','め'],['耳','みみ','くち','はな'],['目','め','て','みみ'],['本','ほん','えんぴつ','つくえ']];function day(){let d=new Date().toLocaleDateString('ja-JP');if(s.day!==d){s.day=d;s.today=0;s.daily=0}}function save(){day();try{localStorage.setItem('hinamaru-v1',JSON.stringify(s))}catch(e){$('feedback').textContent='きろくを ほぞんできません'}$('money').textContent=s.money;$('stats').textContent='きょう '+s.daily+'もん ／ '+s.today+'円　ぜんぶ '+s.count+'もん';$('mission').value=s.daily;$('accessory').textContent=s.dress;dress()}function rand(l,h){return l+Math.floor(Math.random()*(h-l+1))}function start(m,old){mode=m;step=0;done=false;wrong=false;if(m==='jp'){j=old?old.j:rand(0,jp.length-1)}else if(m==='add'){a=old?old.a:rand(2,9);b=old?old.b:rand(11-a,9);x=10-a;y=b-x}else{a=old?old.a:rand(11,29);if(!old&&a%10===9)a--;b=old?old.b:rand(a%10+1,9);x=a-a%10;y=a%10}$('feedback').textContent='いっしょに がんばろう！';$('next').hidden=true;render()}function dots(n){return '<div class="dots">'+Array.from({length:10},(_,i)=>'<span class="dot '+(i<n?'':'empty')+'"></span>').join('')+'</div>'}function render(){let q,p,br='',v='',choices;if(mode==='jp'){q=jp[j][0];p='なんて よむかな？';choices=jp[j].slice(1).sort(()=>Math.random()-.5)}else if(mode==='add'){q=a+' ＋ '+b+' ＝ '+(done?a+b:'？');br=b+'<br>↙　↘<br>'+(step>0?x:'？')+'　'+(step>1?y:'？');p=['10を つくるには '+a+'に いくつ たす？',b+'から '+x+'を とると？','10と '+y+'を あわせると？'][step];v=dots(step===0?a:10)+(step===2?dots(y):'')}else{q=a+' − '+b+' ＝ '+(done?a-b:'？');br=a+'<br>↙　↘<br>'+x+'　'+(step>0?y:'？');p=[x+'と いくつに わける？',x+'から '+b+'を ひくと？','のこりと '+y+'を あわせると？'][step];v=dots(step<2?10:10-b)+(x===20?dots(10):'')+dots(y)}$('question').textContent=q;$('branch').innerHTML=br;$('visual').innerHTML=v;$('prompt').textContent=done?'できたね！':p;$('keys').hidden=done;$('keys').replaceChildren();if(!choices)choices=Array.from({length:(step===2||mode==='sub'&&step===1?30:10)},(_,i)=>i);for(let n of choices){let btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>answer(n);$('keys').append(btn)}}function expected(){return mode==='jp'?jp[j][1]:mode==='add'?[x,y,a+b][step]:[y,x-b,a-b][step]}function answer(n){if(done)return;if(n!==expected()){wrong=true;$('feedback').textContent='だいじょうぶ！ もういちど やってみよう';return}if(mode!=='jp'&&step<2){step++;$('feedback').textContent='いいね！ つぎは？';render();return}done=true;day();let r=Math.max(0,Math.min(s.rate,s.cap-s.today));s.money+=r;s.today+=r;s.count++;s.daily++;let item={mode,a,b,j},key=JSON.stringify(item);s.mistakes=s.mistakes.filter(t=>JSON.stringify(t)!==key);if(wrong)s.mistakes.push(item);save();$('feedback').textContent='🎉 だいせいかい！ '+r+'円 ゲット！';render();$('next').hidden=false}function hint(){if(!done)$('feedback').textContent='ヒント：'+expected()}function speak(){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance($('question').textContent+'。'+$('prompt').textContent);u.lang='ja-JP';speechSynthesis.speak(u)}}function review(){if(s.mistakes.length){let t=s.mistakes[0];start(t.mode,t)}else $('feedback').textContent='ふくしゅうする もんだいは まだないよ！'}function dress(){$('dress').replaceChildren();for(let [i,e] of ['⭐','🎀','🌸','👑'].entries()){let b=document.createElement('button');b.textContent=e+(s.count<i*10?' 🔒':'');b.disabled=s.count<i*10;b.onclick=()=>{s.dress=e;save()};$('dress').append(b)}}function parent(){if(prompt('保護者の暗証番号')===s.pin){$('parentPanel').hidden=false;$('rate').value=s.rate;$('cap').value=s.cap;$('pin').value=s.pin}}function settings(){s.rate=Math.max(0,Math.min(100,Math.floor(Number($('rate').value)||0)));s.cap=Math.max(0,Math.min(10000,Math.floor(Number($('cap').value)||0)));if(/^\d{4,8}$/.test($('pin').value))s.pin=$('pin').value;save();alert('保存しました')}function pay(){if(confirm(s.money+'円を渡しましたか？')){s.money=0;save()}}function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='hinamaru-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restoreFile(input){try{let t=JSON.parse(await input.files[0].text());if(!Number.isFinite(t.money)||!Array.isArray(t.mistakes)||!confirm('現在の記録を上書きしますか？'))return;s={...defaults,...t};save();$('parentPanel').hidden=true}catch(e){alert('読み込めませんでした')}}save();start('add');</script></html>
